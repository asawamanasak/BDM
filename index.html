<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Presentation Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
        }
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            padding: 16px 20px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }
        .btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
        }
        .btn-secondary {
            background-color: #0f172a;
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.2);
        }
        .btn-secondary:hover {
            background-color: #1e293b;
            box-shadow: 0 4px 8px rgba(15, 23, 42, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Presentation Portfolio</h1>
        <p>ยินดีต้อนรับสู่หน้าแดชบอร์ด โปรดเลือกหัวข้อที่ต้องการเข้าชมด้านล่างนี้</p>
        
        <div class="button-list">
            <!-- ปุ่มกดไปยังสไลด์ตัวที่ 1 -->
            <a href="HPE%20Organization%20Chart%20Desktop.html" class="btn">
                📊 HPE Organization Chart Desktop
            </a>
            
            <!-- ปุ่มกดไปยังสไลด์ตัวที่ 2 -->
            <a href="Ingram%20GTM.html" class="btn btn-secondary">
                🚀 Ingram GTM
            </a>
        </div>
    </div>

</body>
</html>
