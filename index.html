<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Presentation Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #000000;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }
        .divider {
            width: 40px;
            height: 1px;
            background-color: #111111;
            margin: 0 auto 40px auto;
        }
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: block;
            padding: 16px 20px;
            background-color: #ffffff;
            color: #111111;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #111111;
            border-radius: 2px;
            transition: all 0.2s ease-in-out;
            letter-spacing: 0.3px;
        }
        .btn:hover {
            background-color: #111111;
            color: #ffffff;
        }
        /* ปุ่มที่สองใช้พื้นดำตั้งแต่แรก เพื่อคุมโทนแบบ minimal (ไม่ใช้สี) */
        .btn-secondary {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #111111;
        }
        .btn-secondary:hover {
            background-color: #ffffff;
            color: #111111;
        }
        footer {
            margin-top: 50px;
            font-size: 11px;
            color: #aaaaaa;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Presentation</h1>
        <p>Internal Use</p>
        <div class="divider"></div>

        <div class="button-list">
            <!-- ปุ่มกดไปยังสไลด์ตัวที่ 1 -->
            <a href="HPE%20Organization%20Chart%20Desktop.html" class="btn">
                HPE Organization Chart
            </a>

            <!-- ปุ่มกดไปยังสไลด์ตัวที่ 2 -->
            <a href="Ingram%20GTM.html" class="btn btn-secondary">
                Ingram GTM
            </a>
        </div>

        <footer>© Internal Portfolio</footer>
    </div>
</body>
</html>
