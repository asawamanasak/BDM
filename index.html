<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Presentation Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #000000;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }
        .divider {
            width: 40px;
            height: 1px;
            background-color: #111111;
            margin: 0 auto 40px auto;
        }
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: block;
            padding: 16px 20px;
            background-color: #ffffff;
            color: #111111;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #111111;
            border-radius: 2px;
            transition: all 0.2s ease-in-out;
            letter-spacing: 0.3px;
        }
        .btn:hover {
            background-color: #111111;
            color: #ffffff;
        }
        .btn-secondary {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #111111;
        }
        .btn-secondary:hover {
            background-color: #ffffff;
            color: #111111;
        }
        footer {
            margin-top: 50px;
            font-size: 11px;
            color: #aaaaaa;
            letter-spacing: 0.5px;
        }

        /* ---------- Password Overlay ---------- */
        #lockOverlay {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .lock-box {
            max-width: 320px;
            width: 100%;
            text-align: center;
            padding: 20px;
        }
        .lock-box h2 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .lock-box .sub {
            font-size: 12px;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }
        #pwInput {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #111111;
            border-radius: 2px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }
        #pwInput:focus {
            border-width: 2px;
        }
        #pwSubmit {
            width: 100%;
            padding: 12px 14px;
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #111111;
            border-radius: 2px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        #pwSubmit:hover {
            background-color: #ffffff;
            color: #111111;
        }
        #pwError {
            margin-top: 12px;
            font-size: 12px;
            color: #c0392b;
            letter-spacing: 0.3px;
            min-height: 16px;
        }

        /* ซ่อนเนื้อหาจริงไว้ก่อนจนกว่าจะใส่รหัสถูก */
        #mainContent {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== หน้าจอกรอกรหัสผ่าน ===== -->
    <div id="lockOverlay">
        <div class="lock-box">
            <h2>Restricted Access</h2>
            <div class="sub">Internal Use Only</div>
            <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
            <button id="pwSubmit">Enter</button>
            <div id="pwError"></div>
        </div>
    </div>

    <!-- ===== เนื้อหาจริงของหน้าเว็บ ===== -->
    <div class="container" id="mainContent">
        <h1>Presentation</h1>
        <p>Internal Use</p>
        <div class="divider"></div>
        <div class="button-list">
            <!-- ปุ่มกดไปยังสไลด์ตัวที่ 1 -->
            <a href="HPE%20Organization%20Chart%20Desktop.html" class="btn">
                HPE Organization Chart
            </a>
            <!-- ปุ่มกดไปยังสไลด์ตัวที่ 2 -->
            <a href="Ingram%20GTM.html" class="btn btn-secondary">
                Ingram GTM
            </a>
        </div>
        <footer>© Internal Portfolio</footer>
    </div>

    <script>
        // เปลี่ยนรหัสผ่านที่ต้องการได้ตรงนี้
        var securePassword = "bdm1234";

        var overlay = document.getElementById("lockOverlay");
        var mainContent = document.getElementById("mainContent");
        var pwInput = document.getElementById("pwInput");
        var pwSubmit = document.getElementById("pwSubmit");
        var pwError = document.getElementById("pwError");

        function checkPassword() {
            if (pwInput.value === securePassword) {
                overlay.style.display = "none";
                mainContent.style.display = "block";
            } else {
                pwError.textContent = "รหัสผ่านไม่ถูกต้อง";
                pwInput.value = "";
                pwInput.focus();
            }
        }

        pwSubmit.addEventListener("click", checkPassword);
        pwInput.addEventListener("keyup", function (e) {
            if (e.key === "Enter") {
                checkPassword();
            }
        });

        // โฟกัสช่องกรอกรหัสทันทีที่โหลดหน้า
        window.onload = function () {
            pwInput.focus();
        };
    </script>
</body>
</html>
